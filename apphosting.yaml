# Firebase App Hosting configuration.
# Secrets live in Cloud Secret Manager; .env.local is local-only and is not
# read during builds or runtime on App Hosting.

env:
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    value: "Kano Health Finance Tracker <notifications@kanohealthbudget.org>"
    availability:
      - RUNTIME
  # Origin used in invite and password-reset email links.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://kanohealthbudget.org
    availability:
      - BUILD
      - RUNTIME
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME
  # Shared with Supabase Vault (notifications_cron_secret) so pg_cron can call
  # /api/notifications/*. See docs/notifications.md.
  - variable: NOTIFICATIONS_CRON_SECRET
    secret: NOTIFICATIONS_CRON_SECRET
    availability:
      - RUNTIME
