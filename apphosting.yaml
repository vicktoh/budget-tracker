# Firebase App Hosting configuration.
# Secrets live in Cloud Secret Manager; .env.local is local-only and is not
# read during builds or runtime on App Hosting.

env:
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    value: "Kano Health Finance Tracker <notifications@kano-budget-tracker.app>"
    availability:
      - RUNTIME
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME
